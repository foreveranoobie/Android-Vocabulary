[versions]
agp = "8.3.1"
kotlin = "1.9.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
constraintlayout = "2.1.4"
lifecycleLivedataKtx = "2.6.1"
lifecycleViewmodelKtx = "2.6.1"
navigation = "2.6.0"
robolectric = "4.12"
gtruth = "1.4.2"
androidx-navigation-testing = "2.7.7"
androidx-fragment-testing = "1.8.2"
mybatis = "3.5.19"
mockito = "5.4.0"
assertj = "3.27.5"
