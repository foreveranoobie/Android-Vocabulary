androidx-fragment-testing = { group = "androidx.fragment", name = "fragment-testing", version.ref = "androidx-fragment-testing" }
androidx-fragment-testing-manifest = { group = "androidx.fragment", name = "fragment-testing-manifest", version.ref = "androidx-fragment-testing" }
mybatis = {group = "org.mybatis", name = "mybatis", version.ref = "mybatis"}
mockito = {group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito"}
assertj = {group = "org.assertj", name = "assertj-core", version.ref = "assertj"}

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
safeargs = {id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation"}


